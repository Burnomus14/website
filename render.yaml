services:
  - type: web
    name: shoe-collection-site
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: shoe-collection-data
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
    envVars:
      - key: STORAGE_DIR
        value: /opt/render/project/src/storage
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SELLER_PHONE_NUMBER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: API_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
