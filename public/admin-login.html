<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f4f4f9; margin: 0; }
        .login-card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 360px; }
        h2 { margin-top: 0; text-align: center; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .toggle-container { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 0.9rem; cursor: pointer; }
        .toggle-container input { width: auto; margin: 0; cursor: pointer; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background: #0056b3; }
        .links { margin-top: 1rem; text-align: center; font-size: 0.9rem; }
        .links a { color: #007bff; text-decoration: none; font-weight: bold; }
        .links a:hover { text-decoration: underline; }
        .error { color: red; margin-top: 1rem; text-align: center; font-size: 0.9rem; }
        .reset-link { display: block; margin-top: 1rem; text-align: center; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Admin Portal</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter password">
                <label class="toggle-container">
                    <input type="checkbox" id="togglePassword"> Show Password
                </label>
            </div>
            <button type="submit">Sign In</button>
            <div class="links">
                <a href="/reset-password.html">Forgot Password?</a>
            </div>
            <div id="errorMsg" class="error" role="alert" aria-live="polite"></div>
        </form>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');

        togglePassword.addEventListener('change', () => {
            passwordInput.type = togglePassword.checked ? 'text' : 'password';
        });

        document.getElementById('loginForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.textContent = '';

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();
                if (!response.ok || !data.success || !data.token) {
                    throw new Error(data.message || 'Invalid credentials');
                }

                localStorage.setItem('adminToken', data.token);
                window.location.href = '/admin.html';
            } catch (error) {
                errorMsg.textContent = error.message || 'Unable to sign in';
            }
        });
    </script>
</body>
</html>
