<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — The Collection</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">THE<span>&nbsp;COLLECTION</span></a>
    <nav><a id="signInLink" href="/account.html">Sign in</a></nav>
  </header>

  <main class="reset-wrap">
    <section class="reset-card">
      <p class="admin-eyebrow">THE COLLECTION / ACCOUNT</p>
      <h1>Reset your password</h1>
      <form id="requestResetForm" class="reset-form">
        <p id="resetHelperText">Enter the email address for your account. If it matches an account, we will send a reset link.</p>
        <div class="field">
          <label for="resetEmail">Email</label>
          <input id="resetEmail" type="email" autocomplete="email" required maxlength="254" />
        </div>
        <button class="btn" type="submit">Send reset link</button>
      </form>
      <p id="resetStatus" class="reset-status" role="status" aria-live="polite"></p>
      <a class="reset-back-link" id="backLink" href="/account.html">Back to sign in</a>
    </section>
  </main>

  <script type="module">
    import { sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import { auth } from '/js/firebase.js';

    const accountType = new URLSearchParams(window.location.search).get('type') === 'admin' ? 'admin' : 'customer';
    const isAdmin = accountType === 'admin';
    document.querySelector('.admin-eyebrow').textContent = isAdmin ? 'THE COLLECTION / ADMIN' : 'THE COLLECTION / ACCOUNT';
    document.getElementById('signInLink').href = isAdmin ? '/admin-login.html' : '/account.html';
    document.getElementById('signInLink').textContent = isAdmin ? 'Admin sign in' : 'Sign in';
    document.getElementById('backLink').href = isAdmin ? '/admin-login.html' : '/account.html';

    const helperText = isAdmin
      ? 'Enter your registered admin email to request a reset link. Note: Reset links are only sent to accounts with the admin title.'
      : 'Enter the email address for your account. If it matches an account, we will send a reset link.';
    document.getElementById('resetHelperText').textContent = helperText;

    document.getElementById('requestResetForm').addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const button = form.querySelector('button');
      const statusMessage = document.getElementById('resetStatus');
      button.disabled = true;
      statusMessage.textContent = '';
      try {
        const response = await fetch('/api/auth/password-reset/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('resetEmail').value.trim(),
            accountType
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Password reset could not be completed. Please try again later.');
        try {
          await sendPasswordResetEmail(auth, document.getElementById('resetEmail').value.trim(), {
            url: `${window.location.origin}/${isAdmin ? 'admin-login.html' : 'account.html'}`
          });
        } catch (error) {
          if (!['auth/user-not-found', 'auth/invalid-credential'].includes(error.code)) throw error;
        }
        statusMessage.textContent = data.message;
        statusMessage.style.color = '#52c41a';
        } catch (error) {
        statusMessage.style.color = '#ff8b8b';
        statusMessage.textContent = error.code === 'auth/unauthorized-continue-uri' ||
          error.code === 'auth/operation-not-allowed'
          ? 'Password reset email is not enabled for this site. Check Firebase Authentication settings.'
          : error.message || 'Password reset could not be completed. Please try again later.';
      } finally {
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
