<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Admin Password</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f4f4f9; margin: 0; }
    .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    input, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
    .msg { margin-top: 15px; font-size: 0.9rem; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Reset Password</h2>
    <p>Enter your admin email to receive a password reset link.</p>
    <form id="resetForm">
      <input type="email" id="resetEmail" placeholder="Admin Email" required />
      <button type="submit">Send Reset Email</button>
    </form>
    <div id="statusMsg" class="msg"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      projectId: "collection-6d7f6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('resetForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('resetEmail').value;
      const statusMsg = document.getElementById('statusMsg');

      try {
        await sendPasswordResetEmail(auth, email);
        statusMsg.style.color = 'green';
        statusMsg.innerText = 'Password reset link sent! Check your inbox.';
      } catch (error) {
        statusMsg.style.color = 'red';
        statusMsg.innerText = error.message;
      }
    });
  </script>
</body>
</html>
