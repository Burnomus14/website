<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Admin Password — The Collection</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">THE<span>&nbsp;COLLECTION</span></a>
    <nav><a href="/admin-login.html">Admin sign in</a></nav>
  </header>

  <main class="reset-wrap">
    <section class="reset-card">
      <p class="admin-eyebrow">THE COLLECTION / ADMIN</p>
      <h1 id="resetTitle">Reset password</h1>

      <form id="requestResetForm" class="reset-form">
        <p>Enter your registered admin email to request a reset link.</p>
        <div class="field">
          <label for="resetEmail">Admin email</label>
          <input id="resetEmail" type="email" autocomplete="email" required maxlength="254" />
        </div>
        <button class="btn" type="submit">Send reset link</button>
      </form>

      <form id="completeResetForm" class="reset-form" hidden>
        <p>Choose a new password for your admin account.</p>
        <div class="field">
          <label for="newPassword">New password</label>
          <input id="newPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="128" />
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm new password</label>
          <input id="confirmPassword" type="password" autocomplete="new-password" required minlength="12" maxlength="128" />
        </div>
        <button class="btn" type="submit">Update password</button>
      </form>

      <p id="resetStatus" class="reset-status" role="status" aria-live="polite"></p>
      <a class="reset-back-link" href="/admin-login.html">Back to admin sign in</a>
    </section>
  </main>

  <script>
    const resetToken = new URLSearchParams(window.location.search).get('token') || '';
    const requestForm = document.getElementById('requestResetForm');
    const completeForm = document.getElementById('completeResetForm');
    const statusMessage = document.getElementById('resetStatus');

    if (resetToken) {
      requestForm.hidden = true;
      completeForm.hidden = false;
      document.getElementById('resetTitle').textContent = 'Choose a new password';
    }

    requestForm.addEventListener('submit', async event => {
      event.preventDefault();
      const button = requestForm.querySelector('button');
      button.disabled = true;
      statusMessage.textContent = '';

      try {
        const response = await fetch('/api/admin/password-reset/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('resetEmail').value.trim() })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Password reset is temporarily unavailable.');
        statusMessage.textContent = data.message;
      } catch (error) {
        statusMessage.textContent = error.message || 'Password reset is temporarily unavailable.';
      } finally {
        button.disabled = false;
      }
    });

    completeForm.addEventListener('submit', async event => {
      event.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (newPassword !== confirmPassword) {
        statusMessage.textContent = 'The passwords do not match.';
        return;
      }

      const button = completeForm.querySelector('button');
      button.disabled = true;
      statusMessage.textContent = '';
      try {
        const response = await fetch('/api/admin/password-reset/complete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: resetToken, newPassword })
        });
        const data = await response.json();
        if (!response.ok || !data.success) throw new Error(data.message || 'This reset link is invalid or expired.');
        completeForm.hidden = true;
        statusMessage.textContent = `${data.message} Redirecting to sign in...`;
        setTimeout(() => { window.location.href = '/admin-login.html'; }, 1800);
      } catch (error) {
        statusMessage.textContent = error.message || 'This reset link is invalid or expired.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
