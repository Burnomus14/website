<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — The Collection</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="topbar">
  <a href="/" class="brand">THE<span>&nbsp;COLLECTION</span></a>
  <nav>
    <a href="/">Archive</a>
    <a href="/admin-login.html" class="active">Admin</a>
    <a href="/admin-transactions.html">Transactions</a>
  </nav>
</header>

<!-- Admin dashboard (shown after session validation) -->
<div class="admin-wrap" id="adminWrap" style="display:none">
  <div class="admin-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px; flex-wrap:wrap; gap:12px;">
    <h1>Manage the collection</h1>
    <div style="display:flex; gap:10px;">
      <button class="btn ghost" type="button" id="toggleAdminBtn">+ Add Admin</button>
      <button class="btn ghost" type="button" id="logoutBtn">Sign out</button>
    </div>
  </div>

  <!-- Add Admin to Firebase Form -->
  <section class="admin-form" id="adminUserSection" style="display:none; border-color:#333; margin-bottom:32px; background:var(--card);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2 style="margin:0; color:var(--ink);">Add Admin directly to Firebase</h2>
      <button class="btn ghost" type="button" id="closeAdminSectionBtn" style="padding:4px 10px; font-size:12px;">✕ Close</button>
    </div>
    <form id="addAdminForm">
      <div class="form-grid">
        <div class="field">
          <label for="newAdminUsername">Username</label>
          <input type="text" id="newAdminUsername" required placeholder="e.g. store_manager" autocomplete="off" autocapitalize="none" spellcheck="false" />
        </div>
        <div class="field">
          <label for="newAdminEmail">Email</label>
          <input type="email" id="newAdminEmail" required placeholder="e.g. admin@company.com" autocomplete="off" autocapitalize="none" spellcheck="false" />
        </div>
        <div class="field span-2">
          <label for="newAdminPassword">Password (minimum 6 characters)</label>
          <input type="password" id="newAdminPassword" required minlength="6" placeholder="Enter secure password" />
        </div>
      </div>
      <div class="row-actions" style="margin-top:18px;">
        <button class="btn" type="submit" id="saveAdminBtn">Save Admin to Firebase</button>
        <button class="btn ghost" type="button" id="cancelAdminBtn">Cancel</button>
      </div>
      <p class="error-msg" id="adminFormError"></p>
    </form>
  </section>

  <section class="admin-form">
    <h2 id="formTitle">Add a new item</h2>
    <form id="itemForm">
      <input type="hidden" id="itemId" value="" />
      <div class="form-grid">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" required />
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="shoes">Shoes</option>
            <option value="clothes">Clothes</option>
            <option value="full outfit">Full Outfit</option>
          </select>
        </div>
        <div class="field">
          <label for="price">Price (optional)</label>
          <input type="text" id="price" placeholder="e.g. $120" />
        </div>
        <div class="field">
          <label for="quantity">Quantity in stock</label>
          <input type="number" id="quantity" min="0" step="1" value="1" required />
        </div>
        <div class="field">
          <label for="status">Status</label>
          <select id="status">
            <option value="in-stock">In stock</option>
            <option value="regular">In the archive</option>
            <option value="sold">Sold</option>
          </select>
        </div>
        <div class="field span-2">
          <label for="caption">Caption</label>
          <textarea id="caption" placeholder="A line or two about this piece"></textarea>
        </div>
        <div class="form-group">
          <label for="imageInput">Product Image:</label>
          <input
            type="file"
            id="imageInput"
            name="image"
            accept="image/*"
          />
          <button type="button" class="btn ghost" id="customUploadBtn">Choose image</button>
        </div>
      </div>
      <div class="row-actions" style="margin-top:18px">
        <button class="btn" type="submit" id="submitBtn">Add item</button>
        <button class="btn ghost" type="button" id="cancelEditBtn" style="display:none">Cancel edit</button>
      </div>
      <p class="error-msg" id="formError"></p>
    </form>
  </section>

  <section>
    <table class="admin-table">
      <thead>
        <tr>
          <th></th>
          <th>Name</th>
          <th>Category</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="itemsTableBody"></tbody>
    </table>
  </section>
</div>

<div class="toast" id="toast"></div>

<script src="/js/admin.js"></script>
</body>
</html>
